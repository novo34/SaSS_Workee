<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/main.css">
</head>
<body class="login-background">
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-card w-100" style="max-width: 420px;">
            <div class="card shadow-lg border-0" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header text-center text-white bg-gradient-hero" style="padding: 2rem 1.5rem 1.5rem;">
                    <h3 class="mb-2 fw-bold">Workee</h3>
                    <p class="mb-0 small opacity-90">Iniciar Sesión</p>
                </div>
                <div class="card-body p-4">
                    <form class="form-modern" id="login-form">
                        <div class="form-modern__group">
                            <label for="email" class="form-modern__label">Email</label>
                            <input type="email" class="form-modern__input form-modern__input--lg" id="email" required autofocus placeholder="tu@email.com">
                        </div>
                        <div class="form-modern__group">
                            <label for="password" class="form-modern__label">Contraseña</label>
                            <input type="password" class="form-modern__input form-modern__input--lg" id="password" required placeholder="••••••••">
                        </div>
                        <div class="form-modern__group">
                            <div class="form-modern__check">
                                <input type="checkbox" class="form-modern__check-input" id="remember">
                                <label class="form-modern__check-label" for="remember">
                                    Recordar sesión
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn-modern btn-modern--primary btn-modern--lg w-100">
                            Iniciar Sesión
                        </button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <a href="/onboarding" class="text-decoration-none" style="color: #0066cc;">¿No tienes cuenta? Regístrate</a>
                    </div>
                    
                    <div id="alert-container" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/frontend/js/login.js"></script>
</body>
</html>
