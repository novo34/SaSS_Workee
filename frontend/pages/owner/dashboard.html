    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <main id="main-content" class="container-fluid" role="main">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Dashboard Owner</h1>
        </div>

        <!-- Métricas - CSS Grid con KPI Cards Modernas -->
        <div class="dashboard-grid dashboard-grid--kpi mb-4">
            <!-- KPI Card - Total Tenants -->
            <div class="kpi-card kpi-card--success">

                        <div class="kpi-card__value" id="metric-tenants">-</div>

                        <div class="kpi-card__value" id="metric-mrr">-</div>

                    </div>

                    </svg>
                </div>
            </div>
            
            <!-- KPI Card - Usuarios Activos -->
            <div class="kpi-card kpi-card--success">
                <div class="kpi-card__header">
                    <div>
                        <div class="kpi-card__value" id="metric-users">-</div>
                        <div class="kpi-card__label">Usuarios Activos</div>
                    </div>
                    <svg class="kpi-card__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>

            </div>

            <div class="kpi-card kpi-card--warning">
                <div class="kpi-card__header">
                    <div>
                        <div class="kpi-card__value" id="metric-churn">-</div>
                        <div class="kpi-card__label">Churn Rate</div>
                    </div>
                    <svg class="kpi-card__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="dashboard-grid dashboard-grid--main-sidebar">

            <div class="card-modern card-modern--elevated">

                </div>
                <div class="card-modern__body">
                    <div id="activity-list">
                        <p class="text-muted mb-0">Cargando...</p>
                    </div>
                </div>
            </div>

            <div class="card-modern card-modern--elevated">
                <div class="card-modern__header">

                </div>
                <div class="card-modern__body">

                    </div>
