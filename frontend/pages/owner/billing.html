<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Billing Owner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/components/components.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <div class="container-fluid">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="billing.title">Billing y Facturación</h1>
        </div>

        <!-- Métricas - CSS Grid con KPI Cards Modernas -->
        <div class="dashboard-grid dashboard-grid--kpi mb-4">
            <!-- KPI Card - MRR -->
            <div class="kpi-card kpi-card--info">
                <div class="kpi-card__header">
                    <div>
                        <div class="kpi-card__value" id="metric-mrr">-</div>
                        <div class="kpi-card__label">MRR</div>
                    </div>
                    <svg class="kpi-card__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- KPI Card - ARR -->
            <div class="kpi-card kpi-card--primary">
                <div class="kpi-card__header">
                    <div>
                        <div class="kpi-card__value" id="metric-arr">-</div>
                        <div class="kpi-card__label">ARR</div>
                    </div>
                    <svg class="kpi-card__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- KPI Card - Facturas Pendientes -->
            <div class="kpi-card kpi-card--warning">
                <div class="kpi-card__header">
                    <div>
                        <div class="kpi-card__value" id="metric-pending">-</div>
                        <div class="kpi-card__label">Facturas Pendientes</div>
                    </div>
                    <svg class="kpi-card__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- KPI Card - Total Facturado (Mes Actual) -->
            <div class="kpi-card kpi-card--success">
                <div class="kpi-card__header">
                    <div>
                        <div class="kpi-card__value" id="metric-monthly">-</div>
                        <div class="kpi-card__label">Facturado Este Mes</div>
                    </div>
                    <svg class="kpi-card__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card-modern mb-4">
            <div class="card-modern__body">
                <div class="row g-3">
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="invoices.status">Estado</label>
                            <select class="form-modern__select" id="filter-status">
                                <option value="" data-i18n="common.all">Todos</option>
                                <option value="draft" data-i18n="invoices.status_draft">Borrador</option>
                                <option value="issued" data-i18n="invoices.status_issued">Emitida</option>
                                <option value="paid" data-i18n="invoices.status_paid">Pagada</option>
                                <option value="failed" data-i18n="invoices.status_failed">Fallida</option>
                                <option value="canceled" data-i18n="invoices.status_canceled">Cancelada</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="common.from">Desde</label>
                            <input type="date" class="form-modern__input" id="filter-from">
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="common.to">Hasta</label>
                            <input type="date" class="form-modern__input" id="filter-to">
                        </div>
                    </div>
                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button class="btn-modern btn-modern--ghost w-100" id="btn-clear-filters">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span data-i18n="common.clear_filters">Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Facturas -->
        <div class="card-modern">
            <div class="card-modern__body">
                <div id="invoices-container">
                    <!-- DataTable se inicializa aquí automáticamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/core/components-loader.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script type="module" src="/frontend/js/owner-base.js"></script>
    <script src="/frontend/js/owner-billing.js"></script>
</body>
</html>
