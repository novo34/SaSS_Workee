<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Importar/Exportar Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/components/components.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <div class="container-fluid">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="import_export.title">Importar/Exportar Datos</h1>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" id="importExportTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-import" data-bs-toggle="tab" data-bs-target="#panel-import" type="button">
                    <i class="bi bi-upload"></i> Importar
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-export" data-bs-toggle="tab" data-bs-target="#panel-export" type="button">
                    <i class="bi bi-download"></i> Exportar
                </button>
            </li>
        </ul>

        <!-- Tab Panels -->
        <div class="tab-content" id="importExportTabContent">
            <!-- Panel Importar -->
            <div class="tab-pane fade show active" id="panel-import" role="tabpanel">
                <div class="card-modern">
                    <div class="card-modern__header">
                        <h5 class="card-modern__title" data-i18n="import_export.import_title">Importar Datos</h5>
                    </div>
                    <div class="card-modern__body">
                        <!-- Selector de tipo de recurso -->
                        <div class="mb-3">
                            <label for="importResourceType" class="form-label" data-i18n="import_export.resource_type">Tipo de Recurso</label>
                            <select class="form-select" id="importResourceType">
                                <option value="employees" data-i18n="import_export.employees">Empleados</option>
                                <option value="workers" data-i18n="import_export.workers">Trabajadores Temporeros</option>
                                <option value="clients" data-i18n="import_export.clients">Clientes</option>
                                <option value="projects" data-i18n="import_export.projects">Proyectos</option>
                            </select>
                        </div>

                        <!-- Descargar plantilla -->
                        <div class="mb-3">
                            <button type="button" class="btn btn-modern btn-modern--secondary" id="downloadTemplateBtn">
                                <i class="bi bi-download"></i> Descargar Plantilla
                            </button>
                        </div>

                        <!-- Subida de archivo -->
                        <div class="mb-3">
                            <label for="importFile" class="form-label" data-i18n="import_export.select_file">Seleccionar Archivo</label>
                            <input type="file" class="form-control" id="importFile" accept=".csv,.xlsx,.xls">
                            <small class="text-muted" data-i18n="import_export.file_help">
                                Formatos soportados: CSV, XLSX. Máximo 10MB.
                            </small>
                        </div>

                        <!-- Preview -->
                        <div id="importPreview" class="mb-3" style="display: none;">
                            <h6 data-i18n="import_export.preview">Vista Previa</h6>
                            <div class="table-responsive">
                                <table class="table table-modern table-sm" id="previewTable">
                                    <thead></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Botón Importar -->
                        <div>
                            <button type="button" class="btn btn-modern btn-modern--primary" id="importBtn" disabled>
                                <i class="bi bi-upload"></i> <span data-i18n="import_export.import">Importar</span>
                            </button>
                        </div>

                        <!-- Resultados -->
                        <div id="importResults" class="mt-4" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <!-- Panel Exportar -->
            <div class="tab-pane fade" id="panel-export" role="tabpanel">
                <div class="card-modern">
                    <div class="card-modern__header">
                        <h5 class="card-modern__title" data-i18n="import_export.export_title">Exportar Datos</h5>
                    </div>
                    <div class="card-modern__body">
                        <!-- Selector de tipo de recurso -->
                        <div class="mb-3">
                            <label for="exportResourceType" class="form-label" data-i18n="import_export.resource_type">Tipo de Recurso</label>
                            <select class="form-select" id="exportResourceType">
                                <option value="employees" data-i18n="import_export.employees">Empleados</option>
                                <option value="workers" data-i18n="import_export.workers">Trabajadores Temporeros</option>
                                <option value="clients" data-i18n="import_export.clients">Clientes</option>
                                <option value="projects" data-i18n="import_export.projects">Proyectos</option>
                                <option value="work_logs" data-i18n="import_export.work_logs">Work Logs</option>
                            </select>
                        </div>

                        <!-- Filtros para work_logs -->
                        <div id="workLogsFilters" style="display: none;" class="mb-3">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="exportDateFrom" class="form-label" data-i18n="import_export.date_from">Fecha Desde</label>
                                    <input type="date" class="form-control" id="exportDateFrom">
                                </div>
                                <div class="col-md-6">
                                    <label for="exportDateTo" class="form-label" data-i18n="import_export.date_to">Fecha Hasta</label>
                                    <input type="date" class="form-control" id="exportDateTo">
                                </div>
                            </div>
                        </div>

                        <!-- Formato -->
                        <div class="mb-3">
                            <label for="exportFormat" class="form-label" data-i18n="import_export.format">Formato</label>
                            <select class="form-select" id="exportFormat">
                                <option value="csv">CSV</option>
                                <option value="json">JSON</option>
                            </select>
                        </div>

                        <!-- Botón Exportar -->
                        <div>
                            <button type="button" class="btn btn-modern btn-modern--primary" id="exportBtn">
                                <i class="bi bi-download"></i> <span data-i18n="import_export.export">Exportar</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/frontend/js/core/api.js"></script>
    <script src="/frontend/js/components/toast.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/import-export.js"></script>
</body>
</html>
