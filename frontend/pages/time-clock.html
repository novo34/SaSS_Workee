<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="time_clock.title">Fichaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/01-settings/theme.css">
    <link rel="stylesheet" href="/frontend/css/06-components/_toast.css">
    <link rel="stylesheet" href="/frontend/css/06-components/_loading-spinner.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .time-clock-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .clock-display {
            text-align: center;
            padding: 2rem;
            background: var(--color-bg);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
        }
        
        .clock-time {
            font-size: 3.5rem;
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
            margin: 1rem 0;
        }
        
        .clock-status {
            font-size: 1.2rem;
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }
        
        .clock-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .btn-clock {
            min-height: 80px;
            font-size: 1.5rem;
            font-weight: var(--font-weight-bold);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            transition: var(--transition-all);
        }
        
        .btn-clock:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-clock-in {
            background: var(--color-success);
            border-color: var(--color-success);
            color: white;
        }
        
        .btn-clock-out {
            background: var(--color-danger);
            border-color: var(--color-danger);
            color: white;
        }
        
        .break-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid var(--color-border);
        }
        
        .history-section {
            margin-top: 3rem;
        }
        
        .history-item {
            background: var(--color-bg);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
        }
        
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .history-item-date {
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
        }
        
        .history-item-hours {
            font-size: 1.2rem;
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
        }
        
        .history-item-times {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }
        
        @media (max-width: 576px) {
            .clock-time {
                font-size: 2.5rem;
            }
            
            .btn-clock {
                min-height: 70px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Header y Sidebar se cargan dinámicamente -->
        
        <main id="main-content" class="main-content" role="main">
            <div class="time-clock-container">
                <!-- Breadcrumbs -->
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item active" data-i18n="time_clock.title">Fichaje</li>
                    </ol>
                </nav>
                
                <!-- Título -->
                <h1 class="h3 mb-4 text-center" data-i18n="time_clock.title">Fichaje Individual</h1>
                
                <!-- Display del reloj -->
                <div class="clock-display">
                    <div class="clock-status" id="clock-status">No fichado</div>
                    <div class="clock-time" id="clock-time">00:00:00</div>
                    <div class="text-muted" id="clock-info">-</div>
                </div>
                
                <!-- Acciones principales -->
                <div class="clock-actions">
                    <button type="button" class="btn btn-clock btn-clock-in" id="btn-clock-in" style="display: none;">
                        <i class="bi bi-play-circle me-2"></i>
                        <span data-i18n="time_clock.clock_in">Entrada</span>
                    </button>
                    <button type="button" class="btn btn-clock btn-clock-out" id="btn-clock-out" style="display: none;">
                        <i class="bi bi-stop-circle me-2"></i>
                        <span data-i18n="time_clock.clock_out">Salida</span>
                    </button>
                </div>
                
                <!-- Sección de pausa -->
                <div class="break-section" id="break-section" style="display: none;">
                    <h5 class="mb-3" data-i18n="time_clock.break">Pausa</h5>
                    <div class="input-group mb-3">
                        <span class="input-group-text" data-i18n="time_clock.minutes">Minutos</span>
                        <input type="number" class="form-control" id="break-minutes" min="1" value="15" placeholder="15">
                        <button type="button" class="btn btn-primary" id="btn-add-break" data-i18n="time_clock.add_break">
                            <i class="bi bi-plus-circle me-2"></i>Agregar Pausa
                        </button>
                    </div>
                    <div class="text-muted small" id="total-breaks">
                        <span data-i18n="time_clock.total_breaks">Total pausas:</span> <span id="total-breaks-minutes">0</span> min
                    </div>
                </div>
                
                <!-- Sección de proyecto (opcional) -->
                <div class="mb-4" id="project-section" style="display: none;">
                    <label for="select-project" class="form-label" data-i18n="time_clock.project">Proyecto (opcional)</label>
                    <select class="form-select" id="select-project">
                        <option value="">Sin proyecto</option>
                    </select>
                </div>
                
                <!-- Notas -->
                <div class="mb-4" id="notes-section" style="display: none;">
                    <label for="clock-notes" class="form-label" data-i18n="time_clock.notes">Notas (opcional)</label>
                    <textarea class="form-control" id="clock-notes" rows="2" placeholder="Notas sobre el fichaje..."></textarea>
                </div>
                
                <!-- Historial -->
                <div class="history-section">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0" data-i18n="time_clock.history">Historial</h5>
                        <div class="input-group" style="max-width: 300px;">
                            <input type="date" class="form-control form-control-sm" id="filter-from" value="">
                            <span class="input-group-text">-</span>
                            <input type="date" class="form-control form-control-sm" id="filter-to" value="">
                        </div>
                    </div>
                    <div id="history-container">
                        <div class="text-center text-muted py-4">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/core/api.js"></script>
    <script src="/frontend/js/core/auth.js"></script>
    <script src="/frontend/js/components/toast.js"></script>
    <script src="/frontend/js/components/loading-spinner.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/time-clock.js"></script>
</body>
</html>
