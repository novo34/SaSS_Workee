<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Aprobaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/components/components.css">
    <link rel="stylesheet" href="/frontend/css/approvals.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <main id="main-content" class="container-fluid" role="main">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="approvals.title">Aprobaciones</h1>
            <div class="page-actions">
                <span class="badge-modern badge-modern--warning d-none" id="pending-count">
                    <span id="pending-number">0</span> <span data-i18n="approvals.pending_approvals">pendientes</span>
                </span>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card-modern mb-4">
            <div class="card-modern__body">
                <div class="row g-3">
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="approvals.filter_employee_type">Tipo de Empleado</label>
                            <select class="form-modern__select" id="filter-employee-type">
                                <option value="" data-i18n="approvals.filter_all_types">Todos</option>
                                <option value="own_employee" data-i18n="approvals.employee_own">Empleado Propio</option>
                                <option value="agency_worker" data-i18n="approvals.employee_agency">Trabajador Temporero</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="approvals.filter_from">Desde</label>
                            <input type="date" class="form-modern__input" id="filter-from">
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="approvals.filter_to">Hasta</label>
                            <input type="date" class="form-modern__input" id="filter-to">
                        </div>
                    </div>
                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button class="btn-modern btn-modern--ghost w-100" id="btn-clear-filters">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span data-i18n="common.clear_filters">Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Acciones masivas -->
        <div class="card-modern mb-4 d-none" id="bulk-actions">
            <div class="card-modern__body">
                <div class="d-flex justify-content-between align-items-center">
                    <span id="selected-count">0 seleccionados</span>
                    <div>
                        <button class="btn-modern btn-modern--success btn-modern--sm me-2" id="btn-bulk-approve">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            <span data-i18n="approvals.batch_approve">Aprobar Seleccionados</span>
                        </button>
                        <button class="btn-modern btn-modern--danger btn-modern--sm" id="btn-bulk-reject">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span data-i18n="approvals.batch_reject">Rechazar Seleccionados</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Work Logs Pendientes -->
        <div class="card-modern">
            <div class="card-modern__body">
                <div id="approvals-container">
                    <!-- DataTable se inicializa aquí automáticamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Rechazar Work Log -->
    <div class="modal fade" id="modal-reject" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="approvals.reject">Rechazar Work Log</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form class="form-modern" id="form-reject">
                        <input type="hidden" id="reject-work-log-id" value="">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="approvals.rejection_reason">Motivo del rechazo</label>
                            <textarea class="form-modern__textarea" id="rejection-reason" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modern btn-modern--secondary" data-bs-dismiss="modal" data-i18n="common.cancel">Cancelar</button>
                    <button type="button" class="btn-modern btn-modern--danger" id="btn-confirm-reject" data-i18n="approvals.reject">Rechazar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Detalles Work Log -->
    <div class="modal fade" id="modal-details" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="approvals.work_log_details">Detalles del Work Log</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="work-log-details">
                    <!-- Se llena dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modern btn-modern--secondary" data-bs-dismiss="modal" data-i18n="common.close">Cerrar</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/core/components-loader.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/approvals.js"></script>
</body>
</html>
