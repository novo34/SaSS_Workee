<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Valoraciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/components/components.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <div class="container-fluid">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="ratings.list">Valoraciones</h1>
            <div class="page-actions">
                <button class="btn-modern btn-modern--primary" id="btn-create-rating">
                    <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span data-i18n="ratings.create">Crear Valoración</span>
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card-modern mb-4">
            <div class="card-modern__body">
                <div class="row g-3">
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="ratings.worker">Trabajador</label>
                            <input type="number" class="form-modern__input" id="filter-worker-id" placeholder="ID del trabajador">
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="ratings.min_score">Puntuación Mínima</label>
                            <select class="form-modern__select" id="filter-min-score">
                                <option value="">Todas</option>
                                <option value="5">5 - Excelente</option>
                                <option value="4">4 - Bueno</option>
                                <option value="3">3 - Regular</option>
                                <option value="2">2 - Malo</option>
                                <option value="1">1 - Muy malo</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="common.from">Desde</label>
                            <input type="date" class="form-modern__input" id="filter-from">
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="common.to">Hasta</label>
                            <input type="date" class="form-modern__input" id="filter-to">
                        </div>
                    </div>
                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button class="btn-modern btn-modern--ghost w-100" id="btn-clear-filters">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span data-i18n="common.clear_filters">Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Valoraciones -->
        <div class="card-modern">
            <div class="card-modern__body">
                <div id="ratings-container">
                    <!-- DataTable se inicializa aquí automáticamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Crear Valoración -->
    <div class="modal fade" id="modal-create-rating" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="ratings.rate_worker">Valorar Trabajador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form class="form-modern" id="form-create-rating">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="ratings.worker">Trabajador ID</label>
                            <input type="number" class="form-modern__input" id="rating-worker-id" required>
                            <small class="form-modern__help" data-i18n="ratings.worker_id_help">ID del trabajador temporero a valorar</small>
                        </div>
                        
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="ratings.score">Puntuación</label>
                            <div class="rating-stars" id="rating-stars">
                                <input type="radio" name="rating-score" id="star-5" value="5" class="rating-input">
                                <label for="star-5" class="rating-star" data-i18n="ratings.score_5">★</label>
                                <input type="radio" name="rating-score" id="star-4" value="4" class="rating-input">
                                <label for="star-4" class="rating-star" data-i18n="ratings.score_4">★</label>
                                <input type="radio" name="rating-score" id="star-3" value="3" class="rating-input">
                                <label for="star-3" class="rating-star" data-i18n="ratings.score_3">★</label>
                                <input type="radio" name="rating-score" id="star-2" value="2" class="rating-input">
                                <label for="star-2" class="rating-star" data-i18n="ratings.score_2">★</label>
                                <input type="radio" name="rating-score" id="star-1" value="1" class="rating-input" required>
                                <label for="star-1" class="rating-star" data-i18n="ratings.score_1">★</label>
                            </div>
                        </div>
                        
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="ratings.select_tags">Etiquetas</label>
                            <div class="tags-container" id="tags-container">
                                <label class="tag-checkbox">
                                    <input type="checkbox" name="tags" value="punctual">
                                    <span data-i18n="ratings.tag_punctual">Puntual</span>
                                </label>
                                <label class="tag-checkbox">
                                    <input type="checkbox" name="tags" value="professional">
                                    <span data-i18n="ratings.tag_professional">Profesional</span>
                                </label>
                                <label class="tag-checkbox">
                                    <input type="checkbox" name="tags" value="skilled">
                                    <span data-i18n="ratings.tag_skilled">Hábil</span>
                                </label>
                                <label class="tag-checkbox">
                                    <input type="checkbox" name="tags" value="communicative">
                                    <span data-i18n="ratings.tag_communicative">Comunicativo</span>
                                </label>
                                <label class="tag-checkbox">
                                    <input type="checkbox" name="tags" value="team_player">
                                    <span data-i18n="ratings.tag_team_player">Trabajo en equipo</span>
                                </label>
                                <label class="tag-checkbox">
                                    <input type="checkbox" name="tags" value="problem_solver">
                                    <span data-i18n="ratings.tag_problem_solver">Resuelve problemas</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="ratings.comment">Comentario</label>
                            <textarea class="form-modern__textarea" id="rating-comment" rows="4" data-i18n-placeholder="ratings.comment_placeholder"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modern btn-modern--secondary" data-bs-dismiss="modal" data-i18n="common.cancel">Cancelar</button>
                    <button type="button" class="btn-modern btn-modern--primary" id="btn-confirm-create-rating" data-i18n="ratings.create">Crear Valoración</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/core/components-loader.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/ratings.js"></script>
</body>
</html>
