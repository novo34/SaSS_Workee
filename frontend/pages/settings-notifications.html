<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Preferencias de Notificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/components/components.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <div class="container-fluid">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="notification_preferences.title">Preferencias de Notificaciones</h1>
        </div>

        <!-- Canales de Notificación -->
        <div class="card-modern mb-4">
            <div class="card-modern__header">
                <h5 class="card-modern__title" data-i18n="notification_preferences.channels">Canales de Notificación</h5>
            </div>
            <div class="card-modern__body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="channel-email" checked>
                            <label class="form-check-label" for="channel-email">
                                <i class="bi bi-envelope"></i> Email
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="channel-sms">
                            <label class="form-check-label" for="channel-sms">
                                <i class="bi bi-phone"></i> SMS
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="channel-whatsapp">
                            <label class="form-check-label" for="channel-whatsapp">
                                <i class="bi bi-whatsapp"></i> WhatsApp
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="channel-webpush" checked>
                            <label class="form-check-label" for="channel-webpush">
                                <i class="bi bi-bell"></i> WebPush
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiet Hours -->
        <div class="card-modern mb-4">
            <div class="card-modern__header">
                <h5 class="card-modern__title" data-i18n="notification_preferences.quiet_hours">Horas Silenciosas</h5>
            </div>
            <div class="card-modern__body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="quietHoursStart" class="form-label" data-i18n="notification_preferences.quiet_hours_start">Hora Inicio</label>
                        <input type="time" class="form-control" id="quietHoursStart">
                    </div>
                    <div class="col-md-6">
                        <label for="quietHoursEnd" class="form-label" data-i18n="notification_preferences.quiet_hours_end">Hora Fin</label>
                        <input type="time" class="form-control" id="quietHoursEnd">
                    </div>
                    <div class="col-12">
                        <small class="text-muted" data-i18n="notification_preferences.quiet_hours_help">
                            Durante estas horas no recibirás notificaciones (excepto eventos críticos como disputas y facturas)
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Preferencias por Evento -->
        <div class="card-modern">
            <div class="card-modern__header">
                <h5 class="card-modern__title" data-i18n="notification_preferences.event_preferences">Preferencias por Evento</h5>
            </div>
            <div class="card-modern__body">
                <div id="eventPreferencesContainer">
                    <!-- Se llena dinámicamente con eventos disponibles -->
                </div>
            </div>
        </div>

        <!-- Botón Guardar -->
        <div class="mt-4">
            <button type="button" class="btn btn-modern btn-modern--primary" id="savePreferencesBtn" data-i18n="common.save">Guardar</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/frontend/js/core/api.js"></script>
    <script src="/frontend/js/components/toast.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/settings-notifications.js"></script>
</body>
</html>
