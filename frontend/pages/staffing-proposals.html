<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Propuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/components/components.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <main id="main-content" class="container-fluid" role="main">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="staffing_proposals.title">Propuestas de Candidatos</h1>
            <div class="page-actions">
                <button class="btn-modern btn-modern--primary" id="btn-new-proposal">
                    <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span data-i18n="staffing_proposals.new">Nueva Propuesta</span>
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card-modern mb-4">
            <div class="card-modern__body">
                <div class="row g-3">
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="staffing_proposals.filter_status">Estado</label>
                            <select class="form-modern__select" id="filter-status">
                                <option value="" data-i18n="staffing_proposals.filter_all">Todos</option>
                                <option value="pending_company" data-i18n="staffing_proposals.filter_pending">Pendientes</option>
                                <option value="accepted" data-i18n="staffing_proposals.filter_accepted">Aceptadas</option>
                                <option value="rejected" data-i18n="staffing_proposals.filter_rejected">Rechazadas</option>
                                <option value="changed" data-i18n="staffing_proposals.filter_changed">Con cambios</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="staffing_proposals.filter_request">Solicitud</label>
                            <input type="number" class="form-modern__input" id="filter-request-id" data-i18n-placeholder="staffing_proposals.filter_request_placeholder">
                        </div>
                    </div>
                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button class="btn-modern btn-modern--ghost w-100" id="btn-filter">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                            </svg>
                            <span data-i18n="staffing_proposals.filter_apply">Filtrar</span>
                        </button>
                    </div>
                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button class="btn-modern btn-modern--ghost w-100" id="btn-clear-filters">
                            <svg class="btn-modern__icon btn-modern__icon--left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span data-i18n="staffing_proposals.filter_clear">Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Propuestas -->
        <div id="proposals-container">
            <div class="text-center py-5" id="loading-spinner-container">
                <!-- LoadingSpinner se inicializa aquí -->
            </div>
        </div>

        <!-- Paginación -->
        <nav aria-label="Paginación" id="pagination-container" class="mt-4 d-none">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

    <!-- Modal: Nueva Propuesta -->
    <div class="modal fade" id="modal-new-proposal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="staffing_proposals.modal_title">Nueva Propuesta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form class="form-modern" id="form-new-proposal">
                        <div class="form-modern__group">
                            <label class="form-modern__label" data-i18n="staffing_proposals.field_request">Solicitud *</label>
                            <select class="form-modern__select" id="request-id" required>
                                <option value="" data-i18n="staffing_proposals.field_request_select">Seleccionar solicitud...</option>
                            </select>
                        </div>
                        
                        <div class="form-modern__group">
                            <div class="form-modern__check">
                                <input class="form-modern__check-input" type="checkbox" id="use-auto-matching" checked>
                                <label class="form-modern__check-label" for="use-auto-matching" data-i18n="staffing_proposals.field_auto_matching">
                                    Usar Auto-Matching (recomendado)
                                </label>
                            </div>
                            <small class="text-muted" data-i18n="staffing_proposals.field_auto_matching_desc">El sistema encontrará automáticamente los mejores candidatos</small>
                        </div>

                        <div id="auto-matching-options" class="form-modern__group">
                            <h6 data-i18n="staffing_proposals.matching_options_title">Opciones de Matching</h6>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <div class="form-modern__group">
                                        <label class="form-modern__label" data-i18n="staffing_proposals.field_max_distance">Distancia Máxima (km)</label>
                                        <input type="number" class="form-modern__input" id="max-distance" value="50" min="1" max="200">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="manual-proposal" class="d-none">
                            <h6 data-i18n="staffing_proposals.manual_candidates_title">Candidatos Manuales</h6>
                            <div id="manual-candidates-list" class="border rounded p-3 mb-3 manual-candidates-list-container">
                                <p class="text-muted" data-i18n="staffing_proposals.manual_candidates_desc">Selecciona trabajadores de la lista</p>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn-modern btn-modern--secondary" data-bs-dismiss="modal" data-i18n="staffing_proposals.btn_cancel">Cancelar</button>
                            <button type="submit" class="btn-modern btn-modern--primary" data-i18n="staffing_proposals.btn_submit">Crear Propuesta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/core/components-loader.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/staffing-proposals.js"></script>
</body>
</html>
