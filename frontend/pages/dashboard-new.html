<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workee - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/main.css">
</head>
<body>
    <!-- El sidebar y header se inyectan automáticamente por index.php -->
    
    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title" data-i18n="dashboard.title">Dashboard</h1>
        <div class="page-actions">
            <button class="btn-modern btn-modern--primary" data-i18n="common.create">Crear</button>
        </div>
    </div>

    <!-- Welcome Card -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" data-i18n="dashboard.welcome">Bienvenido</h5>
                    <p class="card-text" id="welcome-message">
                        <span data-i18n="dashboard.loading_user">Cargando información del usuario...</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions - CSS Grid -->
    <div class="dashboard-grid dashboard-grid--kpi mb-4">
        <div class="card dashboard-card h-100">
            <div class="card-body text-center">
                <h5 class="card-title" data-i18n="dashboard.quick_links">Accesos Rápidos</h5>
                <a href="/agency-company-links" class="btn-modern btn-modern--primary w-100 mb-2" data-i18n="dashboard.manage_links">Gestionar Relaciones</a>
                <a href="/settings" class="btn-modern btn-modern--ghost w-100" data-i18n="dashboard.settings">Configuración</a>
            </div>
        </div>
        <div class="card dashboard-card h-100">
            <div class="card-body text-center">
                <h5 class="card-title" data-i18n="dashboard.tenant_info">Información del Tenant</h5>
                <p class="card-text" id="tenant-info">
                    <span data-i18n="dashboard.loading">Cargando...</span>
                </p>
            </div>
        </div>
        <div class="card dashboard-card h-100">
            <div class="card-body text-center">
                <h5 class="card-title" data-i18n="dashboard.stats">Estadísticas</h5>
                <p class="card-text text-muted" data-i18n="dashboard.coming_soon">Próximamente</p>
            </div>
        </div>
        <div class="card dashboard-card h-100">
            <div class="card-body text-center">
                <h5 class="card-title" data-i18n="dashboard.recent_activity">Actividad Reciente</h5>
                <p class="card-text text-muted" data-i18n="dashboard.coming_soon">Próximamente</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script type="module" src="/frontend/js/dashboard.js"></script>
</body>
</html>
