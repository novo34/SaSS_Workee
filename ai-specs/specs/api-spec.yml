openapi: 3.0.0
info:
  title: Workee SaaS API
  version: 1.0.0
  description: API REST para SaaS multitenant Workee
  contact:
    name: Workee SaaS Support

servers:
  - url: /api/v1
    description: API v1

paths:
  /auth/login:
    post:
      summary: Autenticación de usuario
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      refresh_token:
                        type: string
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /planner.php:
    get:
      summary: Unified planner events (via ?path=events)
      tags:
        - Planner
      parameters:
        - in: query
          name: path
          schema:
            type: string
            enum: [events]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: projectId
          schema:
            type: integer
        - in: query
          name: groupId
          schema:
            type: integer
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [PLANNING, ASSIGNMENTS]
      responses:
        '200':
          description: OK
    post:
      summary: Planner actions (via ?path=slot)
      tags:
        - Planner
      parameters:
        - in: query
          name: path
          schema:
            type: string
            enum: [slot]
      requestBody:
        required: true
      responses:
        '200':
          description: OK

  /project-schedule.php:
    post:
      summary: Create multi-day slots
      tags:
        - Planner
      responses:
        '200':
          description: OK

  /shifts.php:
    get:
      summary: List shifts
      tags:
        - Shifts
      responses:
        '200':
          description: OK
    post:
      summary: Create/Update/Split/Merge/Reassign via action param
      tags:
        - Shifts
      responses:
        '200':
          description: OK

  /work-orders:
    get:
      summary: Listar órdenes de trabajo
      tags:
        - Work Orders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
      responses:
        '200':
          description: Lista de órdenes de trabajo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "validation.required"
        error_key:
          type: string
          example: "validation.required"
        error_params:
          type: object
          example:
            field: "email"
        request_id:
          type: string
          format: uuid

    WorkOrder:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
